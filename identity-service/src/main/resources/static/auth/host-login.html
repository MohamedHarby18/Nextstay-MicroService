<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NextStay - Host Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .coral { color: #FF5A5F; }
        .bg-coral { background-color: #FF5A5F; }
        .forest-bg { background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 60%, transparent 100%), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900&q=80') center/cover; }
    </style>
</head>
<body class="bg-[#fafafa] min-h-screen">
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-white shadow-lg rounded-full px-3 py-2 flex gap-1 border border-gray-100 text-xs font-semibold text-gray-600">
        <a href="guest-login.html" class="hover:bg-[#FFE5E5] hover:text-[#FF5A5F] px-4 py-1.5 rounded-full transition-all">Guest Login</a>
        <a href="host-login.html" class="bg-coral text-white px-4 py-1.5 rounded-full">Host Login</a>
        <a href="employee-login.html" class="hover:bg-[#FFE5E5] hover:text-[#FF5A5F] px-4 py-1.5 rounded-full transition-all">Employee Login</a>
    </div>

    <main class="flex min-h-screen">
        <div class="hidden md:flex md:w-[58%] forest-bg relative">
            <div class="absolute bottom-12 left-12 text-white max-w-md">
                <h1 class="text-5xl font-bold leading-tight mb-4">Your property, your income.</h1>
                <p class="text-xl text-white/90 font-light">Manage your listings and bookings from one place.</p>
            </div>
        </div>
        <div class="flex-1 flex flex-col justify-center items-center p-8 bg-white">
            <div class="w-full max-w-md">
                <span class="inline-block bg-[#FFE5E5] text-[#FF5A5F] text-xs font-bold px-3 py-1 rounded-full mb-4">HOST PORTAL</span>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Host Sign In</h2>
                <form class="space-y-5 mt-8" onsubmit="handleLogin(event, 'HOST')">
                    <input type="email" placeholder="Host Email" class="w-full px-5 py-4 rounded-full border border-gray-200" required/>
                    <input type="password" placeholder="Password" class="w-full px-5 py-4 rounded-full border border-gray-200" required/>
                    <button type="submit" class="w-full py-4 bg-coral text-white font-bold rounded-full shadow-lg">Log In as Host</button>
                </form>
                <p class="mt-10 text-center text-gray-500">New host? <a href="host-register.html" class="coral font-semibold hover:underline">Create host account</a></p>
            </div>
        </div>
    </main>
    <script>
        function handleLogin(e, role) { e.preventDefault(); alert(role + ' Login request sent to /api/auth/login'); }
    </script>
</body>
</html>
