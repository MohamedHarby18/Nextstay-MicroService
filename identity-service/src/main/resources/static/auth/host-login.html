<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NextStay - Host Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body class="bg-[#fafafa] min-h-screen">
    
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-white shadow-lg rounded-full px-3 py-2 flex gap-1 border border-gray-100 text-xs font-semibold text-gray-600">
        <a href="guest-login.html" class="hover:bg-[#FFE5E5] hover:text-[#FF5A5F] px-4 py-1.5 rounded-full transition-all">Guest Login</a>
        <a href="host-login.html" class="bg-coral text-white px-4 py-1.5 rounded-full">Host Login</a>
        <a href="employee-login.html" class="hover:bg-[#FFE5E5] hover:text-[#FF5A5F] px-4 py-1.5 rounded-full transition-all">Employee Login</a>
    </div>

    <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md shadow-sm h-16 flex items-center px-8 justify-between">
        <div class="text-2xl font-bold text-[#4f378a]">NextStay</div>
    </header>

    <main class="flex pt-16 min-h-screen">
        <div class="hidden md:flex md:w-[58%] forest-bg relative">
            <div class="absolute bottom-12 left-12 text-white max-w-md">
                <h1 class="text-5xl font-bold leading-tight mb-4">Your property, your income.</h1>
                <p class="text-xl text-white/90 font-light">Manage your listings and bookings from one place.</p>
            </div>
        </div>
        <div class="flex-1 flex flex-col justify-center items-center p-8 bg-white">
            <div class="w-full max-w-md">
                <span class="inline-block bg-[#FFE5E5] text-[#FF5A5F] text-xs font-bold px-3 py-1 rounded-full mb-4">HOST PORTAL</span>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Host Sign In</h2>
                <p class="text-gray-500 mb-10">Access your host dashboard and manage your properties.</p>
                
                <form id="host-login-form" class="space-y-5">
                    <input type="email" id="email" placeholder="Host Email" class="input-field" required/>
                    <input type="password" id="password" placeholder="Password" class="input-field" required/>
                    <button type="submit" class="btn-primary">Log In as Host</button>
                </form>

                <p class="mt-10 text-center text-gray-500">New host? <a href="host-register.html" class="coral font-semibold hover:underline">Create host account</a></p>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 z-[200] hidden transition-opacity duration-300">
        <div class="bg-[#1d1b20] text-white px-6 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2">
            <span class="material-symbols-outlined text-green-400 text-lg">check_circle</span>
            <span id="toast-msg"></span>
        </div>
    </div>

    <script src="../js/host-login.js"></script>
</body>
</html>
