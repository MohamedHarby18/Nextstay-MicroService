<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NextStay - Internal Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F1F5F9; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-8 relative overflow-hidden">
    
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-white shadow-sm rounded-lg px-2 py-1.5 flex gap-1 border border-slate-200 text-xs font-semibold">
        <a href="guest-login.html" class="text-slate-500 hover:bg-slate-100 px-4 py-1.5 rounded transition-all">Public Site</a>
        <a href="employee-login.html" class="bg-slate-900 text-white px-4 py-1.5 rounded shadow-sm">Employee Portal</a>
    </div>

    <div class="w-full max-w-[520px] relative z-10">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center mb-3">
                <span class="material-symbols-outlined text-slate-900 text-5xl mr-2">domain</span>
                <h1 class="font-bold text-4xl text-slate-900 tracking-tighter">NextStay</h1>
            </div>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-[0.2em]">Internal Operations Portal</p>
        </div>
        
        <div class="bg-white rounded-2xl p-10 shadow-xl border border-slate-200">
            <h2 class="text-3xl font-bold text-slate-900 mb-1 tracking-tight">Employee Login</h2>
            <p class="text-slate-500 mb-8 text-sm">Secure access for authorized personnel only.</p>
            
            <form id="employee-login-form" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-[0.05em] mb-2">Corporate Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                        <input type="email" id="email" placeholder="name@nextstay.com" class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all outline-none" required/>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.05em]">Password</label>
                        <a href="#" class="text-xs font-semibold text-slate-800 hover:underline">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                        <input type="password" id="password" placeholder="••••••••" class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all outline-none" required/>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 pt-2">
                    <input type="checkbox" id="remember-emp" class="w-4 h-4 rounded border-slate-300 accent-slate-900"/>
                    <label for="remember-emp" class="text-sm text-slate-500 font-medium">Remember this workstation for 30 days</label>
                </div>
                
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 rounded-lg hover:bg-slate-800 active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-4 shadow-md">
                    <span>Login to Workspace</span>
                    <span class="material-symbols-outlined text-xl">login</span>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <div class="flex justify-center gap-8 mb-4">
                <a href="#" class="text-sm text-slate-500 hover:text-slate-900 font-medium transition-colors">IT Support</a>
                <a href="#" class="text-sm text-slate-500 hover:text-slate-900 font-medium transition-colors">Internal Policy</a>
                <a href="#" class="text-sm text-slate-500 hover:text-slate-900 font-medium transition-colors">System Status</a>
            </div>
            <p class="text-xs text-slate-400 font-mono">© 2024 NextStay Inc. Internal Systems. All rights reserved.</p>
        </div>
    </div>

    <div class="fixed bottom-0 right-0 p-8 pointer-events-none opacity-[0.03] z-0">
        <span class="material-symbols-outlined text-slate-900" style="font-size:300px;">security</span>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-[200] hidden transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 text-white px-6 py-4 rounded-lg shadow-2xl text-sm font-medium flex items-center gap-3">
            <span class="material-symbols-outlined text-emerald-400 text-xl">check_circle</span>
            <span id="toast-msg"></span>
        </div>
    </div>

    <script src="../js/employee-login.js"></script>
</body>
</html>
