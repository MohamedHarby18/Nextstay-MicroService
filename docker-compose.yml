
services:
  # Eureka Service Discovery
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - nextstay-network

  # Identity Service Database
  mysql-identity:
    image: mysql:8.0
    container_name: mysql-identity
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: NextstayIdentityDB
    volumes:
      - identity-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - nextstay-network

  # Listing Service Database
  mysql-listing:
    image: mysql:8.0
    container_name: mysql-listing
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: NextstayListingDB
    volumes:
      - listing-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - nextstay-network

  # Booking Service Database
  mysql-booking:
    image: mysql:8.0
    container_name: mysql-booking
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: NextstayBookingDB
    volumes:
      - booking-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - nextstay-network

  # Review Service Database
  mysql-review:
    image: mysql:8.0
    container_name: mysql-review
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: NextstayReviewDB
    volumes:
      - review-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - nextstay-network

  # Support Service Database
  mysql-support:
    image: mysql:8.0
    container_name: mysql-support
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: NextstaySupportDB
    volumes:
      - support-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - nextstay-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - nextstay-network

  # Identity Service
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_started
      mysql-identity:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - "SPRING_DATASOURCE_URL=jdbc:mysql://mysql-identity:3306/NextstayIdentityDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Root@123
    networks:
      - nextstay-network

  # Listing Service
  listing-service:
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    container_name: listing-service
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_started
      mysql-listing:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - "SPRING_DATASOURCE_URL=jdbc:mysql://mysql-listing:3306/NextstayListingDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Root@123
    networks:
      - nextstay-network

  # Booking Service
  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_started
      mysql-booking:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - "SPRING_DATASOURCE_URL=jdbc:mysql://mysql-booking:3306/NextstayBookingDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Root@123
    networks:
      - nextstay-network

  # Review Service
  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: review-service
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_started
      mysql-review:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - "SPRING_DATASOURCE_URL=jdbc:mysql://mysql-review:3306/NextstayReviewDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Root@123
    networks:
      - nextstay-network

  # Support Service
  support-service:
    build:
      context: .
      dockerfile: support-service/Dockerfile
    container_name: support-service
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_started
      mysql-support:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - "SPRING_DATASOURCE_URL=jdbc:mysql://mysql-support:3306/NextstaySupportDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Root@123
    networks:
      - nextstay-network

volumes:
  identity-db:
  listing-db:
  booking-db:
  review-db:
  support-db:

networks:
  nextstay-network:
    driver: bridge
