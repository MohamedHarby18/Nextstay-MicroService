spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Identity — split routes so Path predicates are not broken by comma parsing in .properties
spring.cloud.gateway.routes[0].id=identity-auth
spring.cloud.gateway.routes[0].uri=lb://identity-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=identity-users
spring.cloud.gateway.routes[1].uri=lb://identity-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=identity-agents
spring.cloud.gateway.routes[2].uri=lb://identity-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/agents/**

spring.cloud.gateway.routes[3].id=listing-service
spring.cloud.gateway.routes[3].uri=lb://listing-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/listings/**

spring.cloud.gateway.routes[4].id=booking-service
spring.cloud.gateway.routes[4].uri=lb://booking-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reservations/**

spring.cloud.gateway.routes[5].id=review-service
spring.cloud.gateway.routes[5].uri=lb://review-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.routes[6].id=support-service
spring.cloud.gateway.routes[6].uri=lb://support-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/tickets/**
