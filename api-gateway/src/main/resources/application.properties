spring.application.name=api-gateway
server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Gateway routes
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=lb://identity-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/agents/**

spring.cloud.gateway.routes[1].id=listing-service
spring.cloud.gateway.routes[1].uri=lb://listing-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/listings/**

spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=lb://booking-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reservations/**

spring.cloud.gateway.routes[3].id=review-service
spring.cloud.gateway.routes[3].uri=lb://review-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.routes[4].id=support-service
spring.cloud.gateway.routes[4].uri=lb://support-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/tickets/**
